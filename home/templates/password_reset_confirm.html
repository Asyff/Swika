{% extends 'base.html' %}
{% block content %}
<section class="signup-section">
    <div class="signup-container" style="max-width: 500px; margin: 50px auto;">
        <h1>Choose New Password</h1>
        <form method="POST" class="signup">
            {% csrf_token %}
            <!-- Renders secure Django built-in input controls cleanly inside styling -->
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label"><strong>{{ field.label }}</strong></label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="silobtn">Update Password</button>
        </form>
    </div>
</section>
{% endblock %}
