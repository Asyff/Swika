{% extends 'base.html' %}
{% block content %}
<section class="signup-section">
    <div class="signup-container" style="max-width: 500px; margin: 50px auto;">
        <h1>Reset Password</h1>
        <p class="text-muted small">Enter your email address below, and we'll send you a link to reset your password.</p>
        <form method="POST" class="signup">
            {% csrf_token %}
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="Enter registered email address">
            <button type="submit" class="silobtn">Send Reset Link</button>
        </form>
    </div>
</section>
{% endblock %}
